server:
  port: 8081

spring:
  application:
    name: java-pure-graphrag

  # 1. 本地大模型配置 (Spring AI)
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0

  # 2. H2 内存数据库 (存 AI 规则)
  datasource:
    url: jdbc:h2:mem:agri_pure_rules;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  # 3. Neo4j 图数据库 (GraphAgent)
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password123